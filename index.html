    const file = imp.label;
    const added = sel.map(c => createReq({
      type: c.type, title: c.title.trim(), description: c.description, priority: c.priority, status: c.status || 'draft',
      epicId: epicIdFor(c.epic), userTypes: c.type === 'user' ? c.userTypes.map(utIdFor).filter(Boolean) : [],
      source: { kind: imp.via, file, quote: c.quote || '' },
    }, { file, via: imp.via }));
    save();
    const types = new Set(added.map(r => r.type));
    ui.tab = types.size > 1 ? 'all' : [...types][0];
    ui.pri.clear(); ui.uts.clear(); ui.search = ''; $('#search').value = '';
    saveUi();
    $('#importDlg').hidden = true;
    render();
    toast(`Added ${added.length} requirement${added.length === 1 ? '' : 's'} from ${file}`);
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-open], label.opt');
    if (openPopName) {
      const [pop, btn] = POPS[openPopName];
      if (!e.target.closest(pop) && !e.target.closest(btn)) closePops();
    }
    if (!t || t.matches('label.opt')) return;
    const d = t.dataset;

    if (t.id === 'toastAct') { toastAction?.(); $('#toast').hidden = true; return; }
    if (d.tab) { ui.tab = d.tab; ui.pri.clear(); if (!canUtGroup()) ui.uts.clear(); saveUi(); render(); return; }
    if (d.pri) { ui.pri.has(d.pri) ? ui.pri.delete(d.pri) : ui.pri.add(d.pri); render(); return; }
    if (d.toggle) { ui.collapsed.has(d.toggle) ? ui.collapsed.delete(d.toggle) : ui.collapsed.add(d.toggle); saveUi(); renderList(); document.querySelector(`[data-toggle="${CSS.escape(d.toggle)}"]`)?.focus(); return; }
    if (d.qafocus) { ui.collapsed.delete(d.qafocus); renderList(); document.querySelector(`[data-qa="${CSS.escape(d.qafocus)}"]`)?.focus(); return; }
    if (d.rename) { ui.renaming = d.rename; renderList(); const i = $('#renameIn'); i?.focus(); i?.select(); return; }
    if (d.open) { if (pane && pane.id === d.open) return; openReq(d.open); return; }
    if (d.prop && disp) { disp.props[d.prop] = !disp.props[d.prop]; t.setAttribute('aria-pressed', disp.props[d.prop]); return; }
    if (t.id === 'displayBtn') { openPop('display'); return; }
    if (t.id === 'utBtn') { openPop('ut'); return; }
    if (t.id === 'epicBtn') { openPop('epic'); return; }
    if (t.id === 'expandBtn') {
      const keys = $$('[data-toggle]').map(b => b.dataset.toggle);
      const anyCollapsed = keys.some(k => ui.collapsed.has(k));
      keys.forEach(k => anyCollapsed ? ui.collapsed.delete(k) : ui.collapsed.add(k));
      saveUi(); renderList(); return;
    }
    if (t.id === 'newBtn') { openImport('doc'); return; }
    if (t.id === 'setupBtn') { openSetup(); return; }
    if ('closeSetup' in d) { closeSetup(); return; }
    if ('closeImport' in d) { closeImport(); return; }
    if (d.impmode) { imp.mode = d.impmode; imp.file = null; imp.paste = ''; imp.error = ''; renderImport(); $(`[data-impmode="${d.impmode}"]`)?.focus(); return; }

    // Pane draft controls (staged until Update)
    if (d.settype && pane) { pane.draft.type = d.settype; renderPane(); $(`#pType-${d.settype}`)?.focus(); return; }
    if (d.setpri && pane) {
      pane.draft.priority = d.setpri;
      $$('[data-setpri]').forEach(b => b.setAttribute('aria-pressed', b.dataset.setpri === d.setpri));
      renderFoot(); return;
    }
    if (d.ut && pane) {
      const dr = pane.draft;
      dr.userTypes = dr.userTypes.includes(d.ut) ? dr.userTypes.filter(x => x !== d.ut) : [...dr.userTypes, d.ut];
      t.setAttribute('aria-pressed', dr.userTypes.includes(d.ut));
      renderFoot(); return;
    }

    // Setup
    if (d.epicDel) {
      const name = epicName(d.epicDel);
      state.reqs.forEach(r => { if (r.epicId === d.epicDel) { addLog(r, 'epicId', name, 'No epic'); r.epicId = ''; } });
      state.epics = state.epics.filter(x => x.id !== d.epicDel);
      if (pane && pane.draft.epicId === d.epicDel) pane.draft.epicId = '';
      save(); renderSetup(); render(); if (pane) renderPane(); return;
    }
    if (d.epicUp) {
      const i = state.epics.findIndex(x => x.id === d.epicUp);
      if (i > 0) { [state.epics[i - 1], state.epics[i]] = [state.epics[i], state.epics[i - 1]]; save(); renderSetup(); render(); document.querySelector(`[data-epic-up="${d.epicUp}"]`)?.focus(); }
      return;
    }
    if (d.utDel) {
      state.reqs.forEach(r => { if (r.userTypes.includes(d.utDel)) setField(r, 'userTypes', r.userTypes.filter(u => u !== d.utDel)); });
      state.userTypes = state.userTypes.filter(x => x.id !== d.utDel);
      ui.uts.delete(d.utDel);
      if (pane) pane.draft.userTypes = pane.draft.userTypes.filter(u => u !== d.utDel);
      save(); renderSetup(); render(); if (pane) renderPane(); return;
    }
    if (d.confirm) {
      if (d.confirm === 'wipe') { state = emptyState(); toast('Cleared'); }
      if (d.confirm === 'restore-sample') { state = sampleState(); toast('Example project loaded'); }
      setupConfirm = ''; ui.collapsed.clear(); ui.pri.clear(); ui.uts.clear(); ui.search = ''; $('#search').value = '';
      if (pane) { pane = null; $('#pane').hidden = true; $('#paneScrim').hidden = true; document.body.classList.remove('pane-open'); }
      save(); saveUi(); renderSetup(); render(); return;
    }

    const r = cur();
    switch (d.act) {
      case 'new': openNew(); break;
      case 'new-epic': openPop('epic'); break;
      case 'import': openImport(); break;
      case 'import-doc': openImport('doc'); break;
      case 'import-csv': openImport('csv'); break;
      case 'manual': $('#importDlg').hidden = true; openNew(); break;
      case 'setup': openSetup(); break;
      case 'clear-filters': ui.pri.clear(); ui.uts.clear(); ui.search = ''; $('#search').value = ''; render(); break;
      case 'clear-sample': guard(() => { pane = null; closePaneRaw(); state = emptyState(); save(); render(); toast('Examples cleared. Add an epic, import a document or add your first requirement.'); }); break;
      case 'clear-sample-import': state = emptyState(); save(); if (pane) { pane = null; closePaneRaw(); } render(); renderImport(); break;
      case 'name-dismiss': ui.nameDismissed = true; saveUi(); renderBanner(); break;

      // Popovers
      case 'pop-cancel': closePops(true); break;
      case 'disp-reset': disp = { group: UI_DEFAULTS.group, order: UI_DEFAULTS.order, showEmpty: UI_DEFAULTS.showEmpty, showArchived: UI_DEFAULTS.showArchived, props: Object.assign({}, UI_DEFAULTS.props) }; renderDisplay(); $('[data-act="disp-apply"]')?.focus(); break;
      case 'disp-apply': Object.assign(ui, { group: disp.group, order: disp.order, showEmpty: disp.showEmpty, showArchived: disp.showArchived, props: Object.assign({}, disp.props) }); saveUi(); closePops(true); render(); toast('Display updated'); break;
      case 'ut-clear': utDraft.clear(); renderUtPop(); break;
      case 'ut-apply': ui.uts = new Set(utDraft); closePops(true); render(); break;

      // Epics in the list
      case 'inline-epic': ui.addingEpic = true; renderList(); $('#inlEpic')?.focus(); break;
      case 'inline-epic-cancel': ui.addingEpic = false; renderList(); $('[data-act="inline-epic"]')?.focus(); break;
      case 'rename-cancel': ui.renaming = null; renderList(); break;

      // Pane
      case 'close-pane': closePane(); break;
      case 'prev': step(-1); break;
      case 'next': step(1); break;
      case 'create': createFromDraft(); break;
      case 'update': applyDraft(); break;
      case 'discard': pane.draft = draftFrom(r); renderPane(); toast('Changes discarded'); break;
      case 'leave-keep': pane.leaving = null; renderFoot(); $('#pTitle')?.focus(); break;
      case 'leave-discard': { const fn = pane.leaving; pane.leaving = null; if (pane.isNew) pane.draft.title = pane.draft.description = ''; else pane.draft = draftFrom(r); fn?.(); break; }
      case 'leave-update': { const fn = pane.leaving; if (applyDraft()) fn?.(); break; }
      case 'archive': if (!needsClean()) setArchived(r, true); break;
      case 'restore': if (!needsClean()) setArchived(r, false); break;
      case 'delete-ask': pane.confirmDel = true; renderFoot(); $('[data-act="delete-no"]')?.focus(); break;
      case 'delete-no': pane.confirmDel = false; renderFoot(); break;
      case 'delete-yes': { const c = code(r); state.reqs = state.reqs.filter(x => x.id !== r.id); save(); pane = null; closePaneRaw(); render(); toast(`Deleted ${c}`); break; }
      case 'so-open': if (needsClean()) break; pane.signing = true; renderPane(); $('#soBy')?.focus(); break;
      case 'so-cancel': pane.signing = false; renderPane(); break;
      case 'so-save': {
        const by = $('#soBy').value.trim();
        if (!by) { $('#soErr').hidden = false; $('#soBy').focus(); break; }
        r.signoff = { by, date: $('#soDate').value || today(), note: $('#soNote').value.trim(), t: Date.now(), recordedBy: me() };
        setField(r, 'status', 'approved');
        addLog(r, 'signoff', undefined, by);
        pane.signing = false; committedImmediate(r); toast(`Sign-off recorded on ${code(r)}`);
        break;
      }
      case 'so-withdraw': {
        if (needsClean()) break;
        const by = r.signoff?.by; r.signoff = null;
        addLog(r, 'signoff-withdrawn', by);
        if (r.status === 'approved') setField(r, 'status', 'review');
        committedImmediate(r); break;
      }

      // Data
      case 'csv-copy': {
        const csv = toCsv();
        const fb = () => { const o = $('#csvOut'); o.hidden = false; o.value = csv; o.focus(); o.select(); toast('Select the text and copy it'); };
        try { navigator.clipboard.writeText(csv).then(() => toast(`Copied ${state.reqs.length} requirements as CSV`), fb); } catch (err) { fb(); }
        break;
      }
      case 'csv-download':
        downloads?.save({ filename: slug(state.project) + '-requirements.csv', data: toCsv() })
          .then(res => { if (res?.status === 'saved') toast('CSV saved'); })
          .catch(err => { if (err?.code !== 'declined') toast('Download isn\'t available here. Use Copy as CSV instead.'); });
        break;
      case 'wipe': case 'restore-sample': setupConfirm = d.act; renderSetup(); $('[data-confirm="no"]')?.focus(); break;

      // Import
      case 'paste-open': imp.pasteOpen = true; renderImport(); $('#pasteDoc')?.focus(); break;
      case 'imp-clear-file': imp.file = null; imp.error = ''; renderImport(); break;
      case 'imp-go': runImport(); break;
      case 'imp-stop': imp.ctl?.abort(); break;
      case 'imp-back': imp.step = 'source'; imp.cands = []; renderImport(); break;
      case 'imp-add': addCandidates(); break;
    }
  });

  function setArchived(r, v) {
    if (!r || r.archived === v) return;
    r.archived = v; addLog(r, v ? 'archived' : 'restored');
    committedImmediate(r);
    toast(`${v ? 'Archived' : 'Restored'} ${code(r)}`, v ? 'Undo' : null, v ? () => setArchived(r, false) : null);
  }

  document.addEventListener('change', e => {
    const el = e.target;
    // Display and filter popovers: staged until Apply
    if (disp && el.id === 'dGroup') { disp.group = el.value; return; }
    if (disp && el.id === 'dOrder') { disp.order = el.value; return; }
    if (disp && el.id === 'dEmpty') { disp.showEmpty = el.checked; return; }
    if (disp && el.id === 'dArch') { disp.showArchived = el.checked; return; }
    if (utDraft && el.dataset.utopt) { el.checked ? utDraft.add(el.dataset.utopt) : utDraft.delete(el.dataset.utopt); return; }

    // Pane: staged until Update requirement
    if (pane && el.id === 'pType') { pane.draft.type = el.value; renderPane(); return; }
    if (pane && el.id === 'pStatus') { pane.draft.status = el.value; renderFoot(); return; }
    if (pane && el.id === 'pEpic') {
      pane.draft.epicId = el.value;
      const ne = $('#pNewEpic'); ne.hidden = el.value !== '__new'; if (!ne.hidden) ne.focus();
      renderFoot(); return;
    }

    // Import review
    if (el.matches('[data-cs]')) { imp.cands[+el.dataset.cs].sel = el.checked; renderReview(); return; }
    if (el.id === 'selAll') { imp.cands.forEach(c => c.sel = el.checked); renderReview(); return; }
    if (el.matches('[data-ct]')) { const c = imp.cands[+el.dataset.ct]; c.type = el.value; if (c.type !== 'user') c.userTypes = []; renderReview(); return; }
    if (el.matches('[data-cp]')) { imp.cands[+el.dataset.cp].priority = el.value; renderReview(); return; }

    // Setup fields save when you leave them
    const v = el.value.trim();
    if (el.id === 'sProject') { state.project = v || 'Untitled project'; }
    else if (el.id === 'sMe') { state.me = v; }
    else if (el.dataset.epicName) { const x = state.epics.find(q => q.id === el.dataset.epicName); if (x && v && (!findEpic(v) || findEpic(v) === x)) x.name = v; else if (x) el.value = x.name; }
    else if (el.dataset.utName) { const x = state.userTypes.find(q => q.id === el.dataset.utName); if (x && v) x.name = v; else if (x) el.value = x.name; }
    else return;
    save(); render(); if (pane) renderPane();
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'search') { ui.search = el.value; renderList(); return; }
    if (pane && el.id === 'pTitle') { autosize(el); el.classList.remove('err'); $('#pTitleErr').hidden = true; pane.draft.title = el.value; renderFoot(); return; }
    if (pane && el.id === 'pDesc') { pane.draft.description = el.value; renderFoot(); return; }
    if (pane && el.id === 'pNewEpic') { pane.draft.newEpic = el.value; renderFoot(); return; }
    if (el.matches?.('[data-ci]')) { imp.cands[+el.dataset.ci].title = el.value; return; }
  });

  document.addEventListener('submit', e => {
    const f = e.target; e.preventDefault();
    if (f.dataset.form === 'name') {
      const v = $('#nameIn').value.trim(); if (!v) { $('#nameIn').focus(); return; }
      state.me = v; save(); render(); if (pane) renderPane(); toast(`Thanks, ${v}. New requirements will show you as the author.`); return;
    }
    if (f.dataset.form === 'pop-epic') {
      const res = addEpic($('#neName').value, $('#neDesc').value);
      if (res.error) { const er = $('#neErr'); er.textContent = res.error; er.hidden = false; $('#neName').focus(); return; }
      closePops(); afterEpicAdded(res.epic); return;
    }
    if (f.dataset.form === 'inline-epic') {
      const res = addEpic($('#inlEpic').value);
      if (res.error) { const er = $('#inlEpicErr'); er.textContent = res.error; er.hidden = false; $('#inlEpic').focus(); return; }
      ui.addingEpic = false; afterEpicAdded(res.epic); return;
    }
    if (f.dataset.form === 'rename') {
      const x = state.epics.find(q => q.id === f.dataset.epic), v = $('#renameIn').value.trim();
      if (!x) return;
      if (!v) { $('#renameIn').focus(); return; }
      if (findEpic(v) && findEpic(v) !== x) { toast(`There's already an epic called “${findEpic(v).name}”.`); $('#renameIn').focus(); return; }
      const key = 'e:' + x.id; x.name = v; ui.renaming = null; save(); render(); if (pane) renderPane();
      document.querySelector(`[data-toggle="${CSS.escape(key)}"]`)?.focus(); toast('Epic renamed'); return;
    }
    if (f.dataset.addForm) {
      const kind = f.dataset.addForm, inp = f.querySelector('input'), nm = inp.value.trim();
      if (!nm) { inp.focus(); return; }
      if (kind === 'epic') { const res = addEpic(nm); if (res.error) { toast(res.error); inp.focus(); return; } }
      if (kind === 'ut') state.userTypes.push({ id: uid(), name: nm });
      save(); renderSetup(); render(); if (pane) renderPane();
      document.getElementById(kind === 'epic' ? 'newEpicName' : 'newUtName')?.focus();
    }
  });

  document.addEventListener('keydown', e => {
    const el = e.target;
    const typing = /INPUT|TEXTAREA|SELECT/.test(el.tagName);

    if (el.matches?.('.qa-in')) {
      if (e.key === 'Escape') { el.value = ''; el.blur(); e.stopPropagation(); return; }
      if (e.key === 'Enter' && el.value.trim()) {
        e.preventDefault();
        const key = el.dataset.qa, preset = groupInfo[key]?.preset || {};
        const type = preset.type || (ui.tab === 'all' ? 'user' : ui.tab);
        const made = createReq(Object.assign({ type, title: el.value.trim(), userTypes: ui.uts.size === 1 && type === 'user' ? [...ui.uts] : [] }, preset, { type }));
        save(); renderTabs(); renderToolbar(); renderList();
        document.querySelector(`[data-qa="${CSS.escape(key)}"]`)?.focus();
        toast(`Added ${code(made)}`, 'Open', () => openReq(made.id));
      }
      return;
    }
    if (el.matches?.('.row[data-open]')) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!(pane && pane.id === el.dataset.open)) openReq(el.dataset.open); return; }
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); moveByKey(el, e.key === 'ArrowUp' ? -1 : 1); return; }
    }
    if (el.id === 'pTitle' && e.key === 'Enter') { e.preventDefault(); if (pane?.isNew) createFromDraft(); else if (isDirty()) applyDraft(); return; }
    if (el.id === 'renameIn' && e.key === 'Escape') { ui.renaming = null; renderList(); return; }
    if (el.id === 'inlEpic' && e.key === 'Escape') { ui.addingEpic = false; renderList(); return; }
    if (el.matches?.('.ctitle') && e.key === 'Enter') { e.preventDefault(); el.blur(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && pane && $('#pane').contains(el)) { e.preventDefault(); if (pane.isNew) createFromDraft(); else if (isDirty()) applyDraft(); return; }

    if (e.key === 'Escape') {
      if (openPopName) { closePops(true); return; }
      if (!$('#importDlg').hidden) { if (imp.step !== 'drafting') closeImport(); return; }
      if (!$('#setup').hidden) { closeSetup(); return; }
      if (pane) {
        if (pane.leaving) { pane.leaving = null; renderFoot(); return; }
        if (pane.signing) { pane.signing = false; renderPane(); return; }
        if (pane.confirmDel) { pane.confirmDel = false; renderFoot(); return; }
        closePane(); return;
      }
    }
    if (e.key === 'Tab') {
      const box = !$('#importDlg').hidden ? $('#importDlg .modal') : !$('#setup').hidden ? $('#setup') : null;
      if (box) {
        const f = $$('button, input, select, textarea, summary').filter(x => box.contains(x) && !x.disabled && x.offsetParent !== null);
        if (f.length) {
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey || !$('#importDlg').hidden || !$('#setup').hidden || openPopName) return;
    if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
    else if (pane && !pane.isNew && (e.key === 'j' || e.key === 'k')) { e.preventDefault(); step(e.key === 'j' ? 1 : -1); }
  });

  $('#paneScrim').addEventListener('click', closePane);
  $('#scrim').addEventListener('click', closeSetup);
  $('#importDlg').addEventListener('click', e => { if (e.target === $('#importDlg') && imp.step !== 'drafting') closeImport(); });

  render();
})();
</script>
</body>
</html>
